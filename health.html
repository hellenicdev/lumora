<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="alternate icon" href="./favicon.ico">
  <title>Health — Lumora</title>
  <meta name="description" content="Security scanning and code quality health dashboard for your repositories on Lumora.">
  <meta property="og:title" content="Health — Lumora">
  <meta property="og:description" content="Security scanning and code quality health dashboard for your repositories on Lumora.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://hellenicdev.eu/lumora/">
  <link rel="stylesheet" href="./css/main.css">
  <link rel="stylesheet" href="./css/dashboard.css">
  <link rel="stylesheet" href="./css/health.css">
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-9FWQFZME3Z"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-9FWQFZME3Z');</script>
</head>
<body class="dashboard">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <a href="./" class="logo">Lumora</a>
      <button class="sidebar-close" id="sidebarClose"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Main</div>
      <a href="./dashboard.html" class="nav-item">Dashboard</a>
      <a href="./repositories.html" class="nav-item">Repositories</a>
      <a href="./documentation.html" class="nav-item">Documentation</a>
      <a href="./chat.html" class="nav-item">AI Chat</a>
      <a href="./health.html" class="nav-item active">Health</a>
      <a href="./team.html" class="nav-item">Team</a>
      <div class="nav-section-label">Organization</div>
      <a href="./audit.html" class="nav-item">Audit Log</a>
      <a href="./integrations.html" class="nav-item">Integrations</a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user" id="userMenuTrigger">
        <div class="sidebar-user-avatar" id="userAvatar">U</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name" id="userName">User</div>
          <div class="sidebar-user-email" id="userEmail">user@example.com</div>
          <div id="planBadge"></div>
        </div>
      </div>
      <a href="#" id="logoutBtn" class="nav-item" style="color:var(--danger);margin-top:8px">Logout</a>
    </div>
  </aside>
  <div class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <button class="sidebar-toggle" id="sidebarToggle"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
        <h2 style="font-size:18px;font-weight:600">Codebase Health</h2>
      </div>
      <div class="topbar-right">
        <button id="themeToggle" class="icon-btn theme-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path class="sun" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/><path class="moon" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg></button>
      </div>
    </header>
    <div class="page-content">
      <div class="form-group" style="max-width:400px;margin-bottom:32px">
        <select id="healthRepoSelect" class="input">
          <option value="">— Select a repository —</option>
        </select>
      </div>
      <div id="healthContent" style="display:none">
        <div id="personalityCard" class="card" style="padding:20px;margin-bottom:24px;display:none">
          <div style="display:flex;align-items:flex-start;gap:12px">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" style="flex-shrink:0;margin-top:2px"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
            <div style="flex:1">
              <div id="personalityText" style="font-size:14px;line-height:1.6;color:var(--text-primary)"></div>
              <div id="personalityMeta" style="font-size:12px;color:var(--text-muted);margin-top:6px"></div>
            </div>
          </div>
        </div>

        <div class="card" style="padding:32px;margin-bottom:24px;text-align:center">
          <div class="score" id="healthOverall" style="font-size:64px;font-weight:800;letter-spacing:-2px">—</div>
          <div style="font-size:14px;color:var(--text-muted);margin-top:4px">Overall Health Score</div>
        </div>
        <div class="health-grid" id="healthCategories"></div>

        <h3 style="margin:32px 0 16px">Security Report</h3>
        <div id="securityReport"></div>
        <button class="btn btn-primary" id="scanBtn" style="margin-top:16px">Run Security Scan</button>
      </div>
    </div>
  </div>

  <script src="./js/theme.js"></script>
  <script src="./js/config.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/dashboard.js"></script>
  <script src="./js/health.js"></script>
<div class="cookie-consent" id="cookieConsent">
  <p>We use cookies to improve your experience. <a href="./privacy.html">Learn more</a></p>
  <div class="cookie-buttons">
    <button class="btn btn-ghost" id="cookieDecline">Decline</button>
    <button class="btn btn-primary" id="cookieAccept">Accept</button>
  </div>
</div>
<script src="./js/cookie-consent.js"></script>
</body>
</html>
