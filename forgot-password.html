<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.googletagmanager.com https://www.google-analytics.com https://ssl.google-analytics.com https://cdn.socket.io https://challenges.cloudflare.com; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.google-analytics.com https://www.googletagmanager.com https://hellenicdev.eu; font-src 'self' data:; connect-src 'self' https://lumora-9sb3.onrender.com wss://lumora-9sb3.onrender.com http://localhost:3070 ws://localhost:3070 http://127.0.0.1:3070 ws://127.0.0.1:3070 https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <link rel="canonical" href="https://hellenicdev.eu/lumora/forgot-password.html">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="alternate icon" href="./favicon.ico">
  <title>Forgot password — Lumora</title>
  <meta name="description" content="Reset your Lumora account password.">
  <meta property="og:title" content="Forgot password — Lumora">
  <meta property="og:description" content="Reset your Lumora account password.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://hellenicdev.eu/lumora/forgot-password.html">
  <link rel="stylesheet" href="./css/main.css">
  <link rel="stylesheet" href="./css/auth.css">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script src="./js/toast.js" defer></script>

  <script src="./js/analytics.js" defer></script>
</head>
<body class="auth-page">
  <div class="auth-glow"></div>
  <div class="auth-container">
    <div class="auth-header">
      <a href="./" class="logo">Lumora</a>
      <h1>Reset your password</h1>
      <p>Enter your email and we'll send you a reset link</p>
    </div>
    <form id="forgotForm" class="auth-form glass">
      <div id="alert" class="alert" role="alert"></div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" class="input" placeholder="you@company.com" required autocomplete="email">
      </div>
      <div id="turnstileWidget"></div>
      <button type="submit" class="btn btn-primary auth-submit">Send reset link</button>
    </form>
    <div class="auth-footer">
      <a href="./login.html">Back to log in</a>
    </div>
  </div>
  <script src="./js/theme.js" defer></script>
  <script src="./js/config.js" defer></script>
  <script src="./js/api.js" defer></script>
  <script src="./js/auth.js" defer></script>
<div class="cookie-consent" id="cookieConsent">
  <p>We use cookies to improve your experience. <a href="./privacy.html">Learn more</a></p>
  <div class="cookie-buttons">
    <button class="btn btn-ghost" id="cookieDecline">Decline</button>
    <button class="btn btn-primary" id="cookieAccept">Accept</button>
  </div>
</div>
<script src="./js/cookie-consent.js" defer></script>
</body>
</html>
