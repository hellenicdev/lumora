services:
  - type: web
    name: lumora-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node --import ./instrument.js server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SENTRY_DSN
        value: https://f8436f075ecc56fcedee25819d23dde5@o4511908991729664.ingest.de.sentry.io/4511908999200848
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: TURNSTILE_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: noreply@lumora.dev
      - key: FRONTEND_URL
        value: https://hellenicdev.eu/lumora
      - key: ALLOWED_ORIGINS
        value: https://hellenicdev.eu
      - key: KOFI_PAGE_URL
        sync: false
      - key: KOFI_WEBHOOK_TOKEN
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_CALLBACK_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: GROQ_MODEL_FAST
        value: llama3-8b-8192
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
