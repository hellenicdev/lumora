<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.googletagmanager.com https://www.google-analytics.com https://ssl.google-analytics.com https://cdn.socket.io https://challenges.cloudflare.com; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.google-analytics.com https://www.googletagmanager.com https://hellenicdev.eu; font-src 'self' data:; connect-src 'self' https://lumora-9sb3.onrender.com wss://lumora-9sb3.onrender.com http://localhost:3070 ws://localhost:3070 http://127.0.0.1:3070 ws://127.0.0.1:3070 https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <link rel="canonical" href="https://hellenicdev.eu/lumora/organization.html">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="alternate icon" href="./favicon.ico">
  <title>Organization — Lumora</title>
  <meta name="description" content="Manage your Lumora organization settings and members.">
  <meta property="og:title" content="Organization — Lumora">
  <meta property="og:description" content="Manage your Lumora organization settings and members.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://hellenicdev.eu/lumora/organization.html">
  <link rel="stylesheet" href="./css/main.css">
  <link rel="stylesheet" href="./css/dashboard.css">
  <link rel="stylesheet" href="./css/team.css">
  <link rel="stylesheet" href="./css/repositories.css">

  <script src="./js/analytics.js" defer></script>
</head>
<body class="dashboard">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <a href="./" class="logo">Lumora</a>
      <button class="sidebar-close" id="sidebarClose"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Main</div>
      <a href="./dashboard.html" class="nav-item">Dashboard</a>
      <a href="./repositories.html" class="nav-item">Repositories</a>
      <a href="./documentation.html" class="nav-item">Documentation</a>
      <a href="./chat.html" class="nav-item">AI Chat</a>
      <a href="./health.html" class="nav-item">Health</a>
      <a href="./team.html" class="nav-item active">Team</a>
      <div class="nav-section-label">Organization</div>
      <a href="./audit.html" class="nav-item">Audit Log</a>
      <a href="./integrations.html" class="nav-item">Integrations</a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user" id="userMenuTrigger">
        <div class="sidebar-user-avatar" id="userAvatar">U</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name" id="userName">User</div>
          <div class="sidebar-user-email" id="userEmail">user@example.com</div>
          <div id="planBadge"></div>
        </div>
      </div>
      <a href="#" id="logoutBtn" class="nav-item" style="color:var(--danger);margin-top:8px">Logout</a>
    </div>
  </aside>
  <div class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <button class="sidebar-toggle" id="sidebarToggle"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
        <a href="./team.html" class="btn btn-ghost" style="padding:4px 8px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          Back
        </a>
      </div>
      <div class="topbar-right">
        <button id="themeToggle" class="icon-btn theme-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path class="sun" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/><path class="moon" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg></button>
      </div>
    </header>

    <div class="page-content">
      <div id="orgLoading" class="card" style="padding:60px;text-align:center">
        <div class="skeleton" style="width:200px;height:28px;margin:0 auto 12px"></div>
      </div>

      <div id="orgContent" style="display:none">
        <div class="org-detail-header">
          <div class="org-icon" id="orgIcon" style="width:56px;height:56px;font-size:24px">L</div>
          <div>
            <h1 id="orgName" style="font-size:28px;font-weight:700;margin-bottom:4px">—</h1>
            <p id="orgMeta" style="color:var(--text-secondary)">—</p>
          </div>
          <div style="margin-left:auto">
            <span class="badge badge-primary" id="orgPlan">free</span>
          </div>
        </div>

        <div style="display:flex;gap:12px;margin-top:8px">
          <button class="btn btn-ghost" id="leaveOrgBtn" style="color:var(--error);border-color:rgba(239,68,68,0.3);display:none">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Leave Organization
          </button>
        </div>

        <div class="tabs" style="margin-top:32px">
          <button class="tab active" data-tab="members">Members</button>
          <button class="tab" data-tab="invite">Invite</button>
        </div>

        <div id="tab-members" class="tab-content">
          <div class="member-list" id="memberList"></div>
        </div>

        <div id="tab-invite" class="tab-content" style="display:none">
          <div class="card" style="padding:24px;max-width:500px">
            <h3 style="font-size:18px;margin-bottom:8px">Invite Member</h3>
            <p style="color:var(--text-secondary);font-size:14px;margin-bottom:16px">Send an invitation to join this organization.</p>
            <form id="inviteForm">
              <div class="form-group">
                <label for="inviteEmail">Email address</label>
                <input type="email" id="inviteEmail" class="input" placeholder="colleague@example.com" required>
              </div>
              <div class="form-group">
                <label for="inviteRole">Role</label>
                <select id="inviteRole" class="input">
                  <option value="developer">Developer</option>
                  <option value="admin">Admin</option>
                  <option value="viewer">Viewer</option>
                </select>
              </div>
              <button type="submit" class="btn btn-primary" style="margin-top:8px">Send Invitation</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="./js/theme.js" defer></script>
  <script src="./js/config.js" defer></script>
  <script src="./js/api.js" defer></script>
  <script src="./js/dashboard.js" defer></script>
  <script src="./js/organization.js" defer></script>
<div class="cookie-consent" id="cookieConsent">
  <p>We use cookies to improve your experience. <a href="./privacy.html">Learn more</a></p>
  <div class="cookie-buttons">
    <button class="btn btn-ghost" id="cookieDecline">Decline</button>
    <button class="btn btn-primary" id="cookieAccept">Accept</button>
  </div>
</div>
<script src="./js/cookie-consent.js" defer></script>
</body>
</html>
