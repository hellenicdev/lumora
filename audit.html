<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>

  <link rel="alternate icon" href="/lumora/favicon.ico">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-9FWQFZME3Z"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-9FWQFZME3Z');</script>
  <style>
    .audit-table { width: 100%; border-collapse: collapse; }
    .audit-table th { font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; padding: 0.75rem 1rem; text-align: left; border-bottom: 1px solid var(--border-color); font-weight: 600; }
    .audit-table td { padding: 0.65rem 1rem; border-bottom: 1px solid var(--border-color); font-size: 0.85rem; }
    .audit-table tr:hover td { background: var(--bg-subtle); }
    .audit-action { font-weight: 500; }
    .audit-detail { font-size: 0.8rem; color: var(--text-secondary); max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .audit-time { font-size: 0.8rem; color: var(--text-secondary); white-space: nowrap; }
    .audit-pagination { display: flex; align-items: center; justify-content: center; gap: 1rem; margin-top: 1.5rem; }
    .audit-pagination .page-info { font-size: 0.85rem; color: var(--text-secondary); }
    .audit-filters { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
    .audit-filters select, .audit-filters .input { padding: 0.4rem 0.75rem; font-size: 0.85rem; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-primary); }
    .audit-empty { text-align: center; padding: 4rem 0; color: var(--text-secondary); }
  </style>
</head>
<body>
  <div class="dashboard-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="/lumora/" class="logo">Lumora</a>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section-label">Main</div>
        <a href="/lumora/dashboard.html" class="nav-item">Dashboard</a>
        <a href="/lumora/repositories.html" class="nav-item">Repositories</a>
        <a href="/lumora/documentation.html" class="nav-item">Documentation</a>
        <a href="/lumora/chat.html" class="nav-item">AI Chat</a>
        <a href="/lumora/health.html" class="nav-item">Health</a>
        <a href="/lumora/team.html" class="nav-item">Team</a>
        <div class="nav-section-label">Organization</div>
        <a href="/lumora/audit.html" class="nav-item active">Audit Log</a>
        <a href="/lumora/integrations.html" class="nav-item">Integrations</a>
      </nav>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <h1>Audit Log</h1>
        </div>
        <div class="topbar-right">
          <button id="themeToggle" class="icon-btn theme-btn" aria-label="Toggle theme">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path class="sun" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
              <path class="moon" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
            </svg>
          </button>
          <div class="user-menu" id="userMenu">
            <button class="user-avatar" id="userMenuBtn">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </button>
            <div class="user-dropdown" id="userDropdown">
              <div class="dropdown-header">
                <div class="dropdown-user-name" id="dropdownUserName">User</div>
                <div class="dropdown-user-email" id="dropdownUserEmail"></div>
              </div>
              <div class="dropdown-divider"></div>
              <a href="/lumora/dashboard.html" class="dropdown-item" data-action="dashboard">Dashboard</a>
              <a href="/lumora/upgrade.html" class="dropdown-item" data-action="plans">Plans</a>
              <div class="dropdown-item" data-action="settings">Settings</div>
              <div class="dropdown-divider"></div>
              <div class="dropdown-item" data-action="logout" style="color:var(--error)">Sign out</div>
            </div>
          </div>
        </div>
      </header>

      <div class="page-content">
        <div id="pageContent">
          <div class="card" style="padding:1.5rem">
            <div class="audit-filters" id="auditFilters"></div>
            <div id="auditContent">
              <p style="text-align:center;padding:3rem 0;color:var(--text-muted)">Loading audit log...</p>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="/lumora/js/theme.js"></script>
  <script src="/lumora/js/config.js"></script>
  <script src="/lumora/js/api.js"></script>

<div class="cookie-consent" id="cookieConsent">

  <div class="cookie-buttons">
    <button class="btn btn-ghost" id="cookieDecline">Decline</button>
    <button class="btn btn-primary" id="cookieAccept">Accept</button>
  </div>
</div>
<script src="/lumora/js/cookie-consent.js"></script>

</html>
