  <style>
    .audit-table { width: 100%; border-collapse: collapse; }
    .audit-table th { font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; padding: 0.75rem 1rem; text-align: left; border-bottom: 1px solid var(--border-color); font-weight: 600; }
    .audit-table td { padding: 0.65rem 1rem; border-bottom: 1px solid var(--border-color); font-size: 0.85rem; }

    .audit-action { font-weight: 500; }
    .audit-detail { font-size: 0.8rem; color: var(--text-secondary); max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .audit-time { font-size: 0.8rem; color: var(--text-secondary); white-space: nowrap; }
    .audit-pagination { display: flex; align-items: center; justify-content: center; gap: 1rem; margin-top: 1.5rem; }
    .audit-pagination .page-info { font-size: 0.85rem; color: var(--text-secondary); }
    .audit-filters { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
    .audit-filters select, .audit-filters .input { padding: 0.4rem 0.75rem; font-size: 0.85rem; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-primary); }
